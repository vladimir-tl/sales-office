name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Fail fast on formatting before spending time on browsers and tests
      - run: npm run format:check

      - run: npx playwright install --with-deps chromium

      # The app runs in the background for the rest of the job; logs go to astro-dev.log
      - name: Start app on localhost:4322
        run: nohup npx astro dev --port 4322 --strictPort > astro-dev.log 2>&1 &

      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4322 && echo "App is up" && exit 0
            sleep 2
          done
          echo "App did not start in 120 s"; cat astro-dev.log; exit 1

      # BASE_URL is not set, so tests go to http://localhost:4322.
      # Login-page tests only (@login) for now: they don't need a real backend login
      - run: npm run test:login

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            astro-dev.log
          retention-days: 14
